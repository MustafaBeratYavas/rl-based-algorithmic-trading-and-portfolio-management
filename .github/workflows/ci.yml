name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_DOCKER_CLI_BUILD: "1"
  DOCKER_BUILDKIT: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TORCH_INDEX_URL: "https://download.pytorch.org/whl/cpu"
  TORCH_VERSION: "2.10.0"

defaults:
  run:
    shell: bash

jobs:
  docker-quality:
    name: Docker quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Match container user to runner
        run: |
          echo "DOCKER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "DOCKER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Validate Docker configuration
        run: |
          docker compose config --quiet
          docker compose --profile gpu config --quiet
          bash -n docker/entrypoint.sh

      - name: Build pipeline image
        run: docker compose build pipeline

      - name: Run containerized quality gate
        run: docker compose run --rm pipeline ci

  python-compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --index-url "$TORCH_INDEX_URL" "torch==$TORCH_VERSION"
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Compile Python modules
        run: python -m compileall -q src scripts tests

      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/unit --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: unit-py313
          name: unit-py313
          fail_ci_if_error: false

      - name: Upload coverage artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
